<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda & Rekap Pribadi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-20">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold"><i class="fa-solid fa-calendar-days mr-2"></i>Agenda & Rekap Harian</h1>
            <span id="current-date" class="text-xs bg-indigo-700 px-2 py-1 rounded"></span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Navigation Tabs -->
        <div class="flex rounded-lg bg-slate-200 p-1">
            <button onclick="switchTab('agenda')" id="tab-agenda" class="flex-1 py-2 text-sm font-semibold rounded-md bg-white text-indigo-600 shadow-sm transition">Agenda & Rencana</button>
            <button onclick="switchTab('rekap')" id="tab-rekap" class="flex-1 py-2 text-sm font-semibold rounded-md text-slate-600 transition">Rekap Selesai</button>
        </div>

        <!-- SECTION: AGENDA -->
        <section id="section-agenda" class="space-y-4">
            <!-- Form Input Agenda -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <h2 class="text-sm font-bold text-slate-700 mb-3"><i class="fa-solid fa-plus-circle text-indigo-600 mr-1"></i> Tambah Agenda Baru</h2>
                <form id="form-agenda" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Judul Kegiatan</label>
                        <input type="text" id="ag-title" required class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Contoh: Editing Video / Meeting">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Tanggal</label>
                            <input type="date" id="ag-date" required class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Jam</label>
                            <input type="time" id="ag-time" required class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">Simpan Agenda</button>
                </form>
            </div>

            <!-- Panel Kirim Rekap ke WA dengan Pilihan & Kustom Range -->
            <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl shadow-sm space-y-3">
                <h3 class="text-xs font-bold text-emerald-800 uppercase tracking-wider"><i class="fa-brands fa-whatsapp mr-1"></i> Kirim Rekap Jadwal ke WA</h3>
                
                <!-- Tombol Cepat -->
                <div class="grid grid-cols-4 gap-1.5">
                    <button onclick="sendBatchWA('today')" class="bg-emerald-600 text-white py-1 px-1 rounded text-[11px] font-medium hover:bg-emerald-700 transition">Hari Ini</button>
                    <button onclick="sendBatchWA('week')" class="bg-emerald-600 text-white py-1 px-1 rounded text-[11px] font-medium hover:bg-emerald-700 transition">1 Pekan</button>
                    <button onclick="sendBatchWA('twoweeks')" class="bg-emerald-600 text-white py-1 px-1 rounded text-[11px] font-medium hover:bg-emerald-700 transition">2 Pekan</button>
                    <button onclick="sendBatchWA('month')" class="bg-emerald-600 text-white py-1 px-1 rounded text-[11px] font-medium hover:bg-emerald-700 transition">1 Bulan</button>
                </div>

                <!-- Custom Range Input -->
                <div class="pt-2 border-t border-emerald-200 space-y-2">
                    <span class="block text-[11px] font-medium text-emerald-700">Atau Pilih Rentang Kustom:</span>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="custom-start" class="w-full px-2 py-1 text-xs border border-emerald-300 rounded bg-white">
                        <input type="date" id="custom-end" class="w-full px-2 py-1 text-xs border border-emerald-300 rounded bg-white">
                    </div>
                    <button onclick="sendBatchWA('custom')" class="w-full bg-emerald-700 text-white py-1.5 rounded text-xs font-semibold hover:bg-emerald-800 transition">Kirim Rekap Rentang Kustom ke WA</button>
                </div>
            </div>

            <!-- List Agenda -->
            <div class="space-y-2">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Daftar Agenda Tersimpan</h3>
                <div id="list-agenda" class="space-y-2">
                    <!-- Data Agenda Masuk Sini -->
                </div>
            </div>
        </section>

        <!-- SECTION: REKAP AKTIVITAS -->
        <section id="section-rekap" class="space-y-4 hidden">
            <!-- Form Input Catatan/Rekap -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <h2 class="text-sm font-bold text-slate-700 mb-3"><i class="fa-solid fa-clipboard-check text-emerald-600 mr-1"></i> Catat Hasil Kerja (Log)</h2>
                <form id="form-rekap" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Aktivitas yang Dilakukan</label>
                        <input type="text" id="rk-desc" required class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Contoh: Selesai editing video durasi 5 menit">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Tanggal Selesai</label>
                            <input type="date" id="rk-date" required class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Jam Selesai</label>
                            <input type="time" id="rk-time" required class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-emerald-700 transition">Catat ke Rekap Harian</button>
                </form>
            </div>

            <!-- List Rekap -->
            <div class="space-y-2">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Riwayat Aktivitas</h3>
                <div id="list-rekap" class="space-y-2">
                    <!-- Data Rekap Masuk Sini -->
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript Logic -->
    <script>
        // Tanggal Hari Ini di Header
        const headerOptions = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', headerOptions);

        // Set Default Date & Time di Form & Custom Range
        const now = new Date();
        const todayStr = now.toISOString().split('T')[0];
        const timeStr = now.toTimeString().slice(0,5);

        document.getElementById('ag-date').value = todayStr;
        document.getElementById('ag-time').value = timeStr;
        document.getElementById('rk-date').value = todayStr;
        document.getElementById('rk-time').value = timeStr;
        document.getElementById('custom-start').value = todayStr;
        document.getElementById('custom-end').value = todayStr;

        // Tab Switching
        function switchTab(tab) {
            const secAgenda = document.getElementById('section-agenda');
            const secRekap = document.getElementById('section-rekap');
            const tabAgenda = document.getElementById('tab-agenda');
            const tabRekap = document.getElementById('tab-rekap');

            if(tab === 'agenda') {
                secAgenda.classList.remove('hidden');
                secRekap.classList.add('hidden');
                tabAgenda.className = "flex-1 py-2 text-sm font-semibold rounded-md bg-white text-indigo-600 shadow-sm transition";
                tabRekap.className = "flex-1 py-2 text-sm font-semibold rounded-md text-slate-600 transition";
            } else {
                secAgenda.classList.add('hidden');
                secRekap.classList.remove('hidden');
                tabRekap.className = "flex-1 py-2 text-sm font-semibold rounded-md bg-white text-emerald-600 shadow-sm transition";
                tabAgenda.className = "flex-1 py-2 text-sm font-semibold rounded-md text-slate-600 transition";
            }
        }

        // LocalStorage Data Management
        let agendas = JSON.parse(localStorage.getItem('my_agendas')) || [];
        let rekaps = JSON.parse(localStorage.getItem('my_rekaps')) || [];

        // Helper untuk memformat tanggal lengkap dengan nama hari
        function formatDateWithDay(dateString) {
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            // Tambahkan waktu pukul 00:00 untuk menghindari masalah zona waktu lokal
            const dateObj = new Date(dateString + 'T00:00:00');
            return dateObj.toLocaleDateString('id-ID', options);
        }

        // Function untuk membuat link Google Calendar
        function getGoogleCalendarUrl(item) {
            const cleanDate = item.date.replace(/-/g, '');
            const cleanTime = item.time.replace(':', '') + '00';
            const startDateTime = `${cleanDate}T${cleanTime}`;
            
            const startDateObj = new Date(`${item.date}T${item.time}:00`);
            startDateObj.setHours(startDateObj.getHours() + 1);
            const endDateStr = startDateObj.toISOString().replace(/-|:|\.\d+/g, '');

            const title = encodeURIComponent(item.title);
            const details = encodeURIComponent("Agenda dari Aplikasi Pribadi");

            return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startDateTime}/${endDateStr}&details=${details}`;
        }

        // Function untuk membuat link WhatsApp Direct Satuan
        function getWhatsAppUrl(item) {
            const hariTanggal = formatDateWithDay(item.date);
            const text = encodeURIComponent(`*PENGINGAT AGENDA* 📌\n\nKegiatan: ${item.title}\nHari/Tanggal: ${hariTanggal}\nJam: ${item.time}\n\n_Ayo bersiap untuk melaksanakan kegiatan ini!_`);
            return `https://api.whatsapp.com/send?text=${text}`;
        }

        // Function Kirim Batch ke WA Berdasarkan Range Waktu / Kustom
        function sendBatchWA(range) {
            const today = new Date();
            today.setHours(0,0,0,0);
            
            let startDate = new Date(today);
            let endDate = new Date(today);
            let titleRange = "";

            if(range === 'today') {
                titleRange = "HARI INI";
            } else if(range === 'week') {
                endDate.setDate(today.getDate() + 7);
                titleRange = "1 PEKAN KEDEPAN";
            } else if(range === 'twoweeks') {
                endDate.setDate(today.getDate() + 14);
                titleRange = "2 PEKAN KEDEPAN";
            } else if(range === 'month') {
                endDate.setMonth(today.getMonth() + 1);
                titleRange = "1 BULAN KEDEPAN";
            } else if(range === 'custom') {
                const valStart = document.getElementById('custom-start').value;
                const valEnd = document.getElementById('custom-end').value;
                if(!valStart || !valEnd) {
                    alert('Silakan tentukan Tanggal Mulai dan Tanggal Selesai terlebih dahulu!');
                    return;
                }
                startDate = new Date(valStart);
                startDate.setHours(0,0,0,0);
                endDate = new Date(valEnd);
                endDate.setHours(23,59,59,999);
                titleRange = `${valStart} s/d ${valEnd}`;
            }

            // Filter agenda sesuai range
            const filtered = agendas.filter(item => {
                const itemDate = new Date(item.date);
                itemDate.setHours(0,0,0,0);
                if(range === 'today') {
                    return itemDate.getTime() === startDate.getTime();
                } else {
                    return itemDate >= startDate && itemDate <= endDate;
                }
            });

            if(filtered.length === 0) {
                alert(`Tidak ada agenda untuk kategori ${titleRange}!`);
                return;
            }

            // Urutkan berdasarkan tanggal & waktu
            filtered.sort((a,b) => new Date(a.date + ' ' + a.time) - new Date(b.date + ' ' + b.time));

            let message = `📋 *REKAP JADWAL AGENDA (${titleRange})* 📋\n\n`;
            filtered.forEach((item, index) => {
                const hariTanggal = formatDateWithDay(item.date);
                message += `${index + 1}. *${item.title}*\n   📅 ${hariTanggal} | ⏰ ${item.time}\n\n`;
            });
            message += `_Dikirim otomatis dari Aplikasi Agenda Pribadi_`;

            const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
            window.open(waUrl, '_blank');
        }

        // Tandai Selesai (Pindah dari Agenda ke Rekap Selesai)
        function completeAgenda(index) {
            const item = agendas[index];
            const hariTanggal = formatDateWithDay(item.date);
            
            // Tambah ke rekap
            const newRk = {
                desc: `[Selesai] ${item.title}`,
                dateText: `${hariTanggal} (${item.time})`
            };
            rekaps.push(newRk);
            localStorage.setItem('my_rekaps', JSON.stringify(rekaps));

            // Hapus dari agenda
            agendas.splice(index, 1);
            localStorage.setItem('my_agendas', JSON.stringify(agendas));

            renderAll();
            alert('Agenda berhasil diselesaikan dan dicatat ke riwayat rekap!');
        }

        // Render Data
        function renderAll() {
            // Render Agenda
            const listAg = document.getElementById('list-agenda');
            listAg.innerHTML = agendas.length === 0 ? '<p class="text-xs text-slate-400 text-center py-4">Belum ada agenda tercatat.</p>' : '';
            
            agendas.sort((a,b) => new Date(a.date + ' ' + a.time) - new Date(b.date + ' ' + b.time)).forEach((item, index) => {
                const gcalUrl = getGoogleCalendarUrl(item);
                const waUrl = getWhatsAppUrl(item);
                const hariTanggal = formatDateWithDay(item.date);

                listAg.innerHTML += `
                    <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex justify-between items-center">
                        <div>
                            <span class="text-[10px] bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded font-medium">${hariTanggal} | ${item.time}</span>
                            <h4 class="text-sm font-semibold text-slate-700 mt-1">${item.title}</h4>
                            <div class="flex gap-3 mt-1.5">
                                <a href="${waUrl}" target="_blank" class="text-[10px] text-emerald-600 hover:underline font-medium"><i class="fa-brands fa-whatsapp mr-1"></i> Kirim WA</a>
                                <a href="${gcalUrl}" target="_blank" class="text-[10px] text-blue-600 hover:underline font-medium"><i class="fa-solid fa-calendar-plus mr-1"></i> Kalender</a>
                            </div>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="completeAgenda(${index})" title="Tandai Selesai" class="bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white p-2 rounded-lg transition"><i class="fa-solid fa-check text-xs"></i></button>
                            <button onclick="deleteAgenda(${index})" title="Hapus" class="text-slate-400 hover:text-red-500 p-2"><i class="fa-solid fa-trash-can text-xs"></i></button>
                        </div>
                    </div>
                `;
            });

            // Render Rekap
            const listRk = document.getElementById('list-rekap');
            listRk.innerHTML = rekaps.length === 0 ? '<p class="text-xs text-slate-400 text-center py-4">Belum ada catatan aktivitas.</p>' : '';

            rekaps.sort((a,b) => new Date(b.date + ' ' + b.time) - new Date(a.date + ' ' + a.time)).forEach((item, index) => {
                const displayDate = item.dateText ? item.dateText : `${item.date} - ${item.time}`;
                listRk.innerHTML += `
                    <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex justify-between items-center">
                        <div>
                            <span class="text-[10px] bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded font-medium">${displayDate}</span>
                            <p class="text-sm text-slate-700 mt-1">${item.desc}</p>
                        </div>
                        <button onclick="deleteRekap(${index})" class="text-slate-400 hover:text-red-500 p-2"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>
                `;
            });
        }

        // Handle Submit Agenda
        document.getElementById('form-agenda').addEventListener('submit', function(e) {
            e.preventDefault();
            const newAg = {
                title: document.getElementById('ag-title').value,
                date: document.getElementById('ag-date').value,
                time: document.getElementById('ag-time').value
            };
            agendas.push(newAg);
            localStorage.setItem('my_agendas', JSON.stringify(agendas));
            this.reset();
            document.getElementById('ag-date').value = todayStr;
            document.getElementById('ag-time').value = timeStr;
            renderAll();
        });

        // Handle Submit Rekap
        document.getElementById('form-rekap').addEventListener('submit', function(e) {
            e.preventDefault();
            const hariTanggal = formatDateWithDay(document.getElementById('rk-date').value);
            const timeVal = document.getElementById('rk-time').value;
            const newRk = {
                desc: document.getElementById('rk-desc').value,
                dateText: `${hariTanggal} (${timeVal})`
            };
            rekaps.push(newRk);
            localStorage.setItem('my_rekaps', JSON.stringify(rekaps));
            this.reset();
            document.getElementById('rk-date').value = todayStr;
            document.getElementById('rk-time').value = timeStr;
            renderAll();
        });

        // Delete Functions
        function deleteAgenda(index) {
            agendas.splice(index, 1);
            localStorage.setItem('my_agendas', JSON.stringify(agendas));
            renderAll();
        }

        function deleteRekap(index) {
            rekaps.splice(index, 1);
            localStorage.setItem('my_rekaps', JSON.stringify(rekaps));
            renderAll();
        }

        // Initial Load
        renderAll();
    </script>
</body>
</html>
